baseURL = 'https://side-realms.dev/'
languageCode = 'ja-jp'
publishDir = 'docs'   # GitHub Pages が master の /docs を配信しているため
title = '検品'
buildDrafts = false
buildFuture = false
buildExpired = false
cleanDestinationDir = true
disableHugoGeneratorInject = true

[params]
  author = 'KoheiDoi'
  description = '検品'
  # links ページに並べる外部リンク
  [[params.links]]
    name = 'CTF writeup'
    url = 'https://polar-tray-8ed.notion.site/writeup-14b43a1310e9803fb0fff4e7abba1262'
  [[params.links]]
    name = 'FIA'
    url = 'https://fia.side-realms.dev/'

[menu]
  [[menu.main]]
    identifier = 'portfolio'
    name = 'about'
    url = '/portfolio/'
    weight = 1
  [[menu.main]]
    identifier = 'blogs'
    name = 'blogs'
    url = '/blogs/'
    weight = 2
  # gallery は非公開中のためメニューから外している（復活させるには下の5行のコメントを外す）
#   [[menu.main]]
#     identifier = 'gallery'
#     name = 'gallery'
#     url = '/gallery/'
#     weight = 3
  [[menu.main]]
    identifier = 'links'
    name = 'links'
    url = '/links/'
    weight = 4
  [[menu.main]]
    identifier = 'log'
    name = 'life log'
    url = '/log/'
    weight = 5

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    style = 'github-dark'
    noClasses = true
    lineNos = false
    tabWidth = 4
